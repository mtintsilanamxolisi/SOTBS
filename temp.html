<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics PDFs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar (Placeholder) -->
    <nav class="navbar">
        <h1>Mathematics PDFs</h1>
    </nav>

    <!-- PDF Grid Container -->
    <div class="pdf-grid-container">
        <!-- PDF Item 1 -->
        <div class="pdf-item" title="Grade 1 Mathematics PDF">
            <div class="pdf-preview">
                <embed src="path-to-your-pdf/grade1-math.pdf" type="application/pdf" class="preview-embed">
                <div class="overlay">
                    <h3>Grade 1 Mathematics</h3>
                    <p>A comprehensive PDF for Grade 1 Mathematics.</p>
                </div>
            </div>
            <div class="pdf-controls">
                <a href="path-to-your-pdf/grade1-math.pdf" download class="download-button">Download Grade 1 PDF</a>
            </div>
        </div>

        <!-- PDF Item 2 -->
        <div class="pdf-item" title="Grade 2 Mathematics PDF">
            <div class="pdf-preview">
                <embed src="path-to-your-pdf/grade2-math.pdf" type="application/pdf" class="preview-embed">
                <div class="overlay">
                    <h3>Grade 2 Mathematics</h3>
                    <p>A comprehensive PDF for Grade 2 Mathematics.</p>
                </div>
            </div>
            <div class="pdf-controls">
                <a href="path-to-your-pdf/grade2-math.pdf" download class="download-button">Download Grade 2 PDF</a>
            </div>
        </div>

        <!-- Add more PDF items similarly -->
    </div>

</body>
</html>
